name: cattlez
description: "Aplicación para el control de embarazos del ganado vacuno."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  sqflite: ^2.2.0
  path: ^1.8.3
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^3.0.7
  flutter_localizations:
    sdk: flutter
  table_calendar: ^3.0.9
  shared_preferences: ^2.0.15
  json_serializable: 6.9.2
  logger: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "android/app/src/assets/logo_cattlez.png" 

flutter:
  uses-material-design: true
  generate: true

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations
